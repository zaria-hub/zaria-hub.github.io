      <style>
       :root{
            --background-color-body: #f5f5f5;
            --text-color: #333;
            --h1-color: #2c3e50;
            --card-background:#ffffff;
            --button-background: #3498db;
            --button-color: #ffffff;
            --state:#fd9503;
        }
        body{
            
            text-align: center;
            
        }
        .container{
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0; 
            gap: 10px;        
        }
        .container2{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items:center;
            margin: 5px 0; 
            gap: 10px;  
        }
          
        h1.name{
            color: var(--h1-color);
            font-size: large;
        }
        .cards{
              background:var(--bgcards); 
                border-radius:20px;
                text-align:center;
                justify-content: center;
                padding :10px;
                width: 100%;
                max-width: 900px;
                margin: 0 auto; 
                box-sizing: border-box;
                box-shadow: 0 16px 32px rgba(0,0,0,0.1);
                color:  white;
                border-style:double;
                border-color: var(--teal2-b);
                border-width: 2px;
        }
        .state{
            background: var(  --amber1);
            border-radius: 80px;
            width: 70px;
            height: 70px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            text-align: center;
            justify-content: center;
            position: relative;
        }
        .stateAnim:hover{
            animation:situation 1s  linear forwards;
            color: transparent;
        }
        .state::after{
            content:attr(data-value);
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            color: var(--text-color);

        }
        .state:hover:after{
            opacity:1;
        }
        .card-thumb{
            width: 90px;
            height: 90px;
            border-radius: 10px;
            border: 3px;
            object-fit: cover;
             }
        .card-transform:hover{
            transform: translateY(-1px) scale(1.001);
            box-shadow: 0px 25px 50px rgba(0,0,0,25);
            }
      
        @keyframes situation{
            from {  border-radius: 80px;
                    color: var(--text-color);
                    width: 70px;
            }
            to {  border-radius: 10px;
                  color:transparent;
                  width: 90px;
                }
        }
       
      </style>
    </head>
